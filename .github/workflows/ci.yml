name: CI
on:
  push:
    branches: [main, acceptance-work]
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Client dependencies and state regressions
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund && npm run test:ui
      - name: Rebuild and compare bundled client
        working-directory: frontend
        run: npm run build && node scripts/check-bundle.mjs
      - name: Unit and integration tests
        run: uv run --locked python -m unittest discover -s tests -q
      - name: Public-input isolation
        run: uv run --locked python scripts/check_isolation.py
      - name: Published evidence integrity
        run: uv run --locked python scripts/verify_release.py
