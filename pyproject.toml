[project]
name = "trippilot"
version = "0.2.0"
description = "Verifiable travel planning and local replanning agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==3.3.2",
    "func-timeout==4.3.5",
    "fuzzywuzzy==0.18.0",
    "geopy==2.4.1",
    "json-repair==0.30.0",
    "jsonschema==4.23.0",
    "numpy==1.26.4",
    "openai>=1.66.0",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "tqdm==4.66.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
